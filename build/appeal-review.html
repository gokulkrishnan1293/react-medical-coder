<title>Appeal Review Workbench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: document-first canvas. Record fills the stage; notepad floats or docks right; minimap rail on the scroll edge. */
:root {
  --desk: #DDE3E8;
  --paper: #FFFFFD;
  --chrome: #F4F6F8;
  --chrome-2: #E9EDF1;
  --ink: #17222D;
  --ink-2: #485664;
  --ink-3: #7C8997;
  --ink-faint: rgba(23, 34, 45, 0.22);
  --line: #CDD5DC;
  --accent: #0A6B74;
  --accent-ink: #FFFFFF;
  --accent-soft: #D3EBED;
  --ai: #2C62D4;
  --ai-fill: rgba(44, 98, 212, 0.09);
  --ok: #1B8047;
  --ok-fill: rgba(27, 128, 71, 0.11);
  --add: #BF6508;
  --add-fill: rgba(214, 125, 20, 0.17);
  --rej: #BE3434;
  --rej-fill: rgba(190, 52, 52, 0.07);
  --on-tag: #FFFFFF;
  --shadow: 0 18px 40px -12px rgba(18, 32, 46, 0.32), 0 2px 6px rgba(18, 32, 46, 0.10);
  --page-shadow: 0 1px 2px rgba(18, 32, 46, 0.12), 0 10px 28px -14px rgba(18, 32, 46, 0.28);
  --scrim: rgba(12, 22, 32, 0.42);
  --ui: 'Public Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #0E1318; --paper: #1A2129; --chrome: #141A20; --chrome-2: #1F2830;
    --ink: #DCE3E9; --ink-2: #A5B1BC; --ink-3: #6E7B87; --ink-faint: rgba(220, 227, 233, 0.2);
    --line: #2B3540; --accent: #4DB6C0; --accent-ink: #062629; --accent-soft: #123A3F;
    --ai: #74A0FF; --ai-fill: rgba(116, 160, 255, 0.13);
    --ok: #52C584; --ok-fill: rgba(82, 197, 132, 0.13);
    --add: #F2A348; --add-fill: rgba(242, 163, 72, 0.18);
    --rej: #F07474; --rej-fill: rgba(240, 116, 116, 0.09);
    --on-tag: #0B1116;
    --shadow: 0 18px 44px -12px rgba(0, 0, 0, 0.7), 0 2px 6px rgba(0, 0, 0, 0.4);
    --page-shadow: 0 1px 2px rgba(0, 0, 0, 0.5), 0 10px 28px -14px rgba(0, 0, 0, 0.7);
    --scrim: rgba(0, 0, 0, 0.55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk: #0E1318; --paper: #1A2129; --chrome: #141A20; --chrome-2: #1F2830;
  --ink: #DCE3E9; --ink-2: #A5B1BC; --ink-3: #6E7B87; --ink-faint: rgba(220, 227, 233, 0.2);
  --line: #2B3540; --accent: #4DB6C0; --accent-ink: #062629; --accent-soft: #123A3F;
  --ai: #74A0FF; --ai-fill: rgba(116, 160, 255, 0.13);
  --ok: #52C584; --ok-fill: rgba(82, 197, 132, 0.13);
  --add: #F2A348; --add-fill: rgba(242, 163, 72, 0.18);
  --rej: #F07474; --rej-fill: rgba(240, 116, 116, 0.09);
  --on-tag: #0B1116;
  --shadow: 0 18px 44px -12px rgba(0, 0, 0, 0.7), 0 2px 6px rgba(0, 0, 0, 0.4);
  --page-shadow: 0 1px 2px rgba(0, 0, 0, 0.5), 0 10px 28px -14px rgba(0, 0, 0, 0.7);
  --scrim: rgba(0, 0, 0, 0.55);
  color-scheme: dark;
}

html, body { height: 100%; }
body { background: var(--desk); color: var(--ink); font-family: var(--ui); font-size: 13.5px; overflow: hidden; }
#root { height: 100%; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sp { flex: 1; }

/* status tokens */
.st-ai { --c: var(--ai); --cf: var(--ai-fill); }
.st-confirmed { --c: var(--ok); --cf: var(--ok-fill); }
.st-added { --c: var(--add); --cf: var(--add-fill); }
.st-rejected { --c: var(--rej); --cf: var(--rej-fill); }

.app { height: 100%; display: grid; grid-template-rows: auto auto minmax(0, 1fr); }

/* ---- top bar ---- */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; padding: 10px 16px; background: var(--chrome); border-bottom: 1px solid var(--line); }
.case { min-width: 0; }
.case-l1 { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.case-id { font: 600 11px/1 var(--mono); letter-spacing: 0.03em; color: var(--accent); background: var(--accent-soft); padding: 4px 6px; border-radius: 4px; }
.case-name { font-weight: 700; font-size: 15px; letter-spacing: -0.01em; }
.case-mrn { font: 12px var(--mono); color: var(--ink-3); }
.case-l2 { font-size: 12px; color: var(--ink-2); margin-top: 3px; }
.denial { display: grid; grid-template-columns: auto auto; column-gap: 8px; align-items: baseline; }
.den-k { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-3); }
.den-v { font: 600 14px var(--mono); }
.den-v s { color: var(--rej); text-decoration-thickness: 1.5px; }
.den-carc { grid-column: 1 / -1; font-size: 11.5px; color: var(--ink-2); }
.due { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--add); background: var(--add-fill); padding: 5px 9px; border-radius: 6px; }
.due b { font-weight: 650; }
.controls { margin-left: auto; display: flex; gap: 4px; flex-wrap: wrap; }
.tg { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border: 1px solid transparent; background: transparent; border-radius: 7px; cursor: pointer; font-size: 12.5px; color: var(--ink-2); }
.tg:hover { background: var(--chrome-2); color: var(--ink); }
.tg[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }
.tg.cmd { border-color: var(--line); }
.badge { font: 600 10.5px/1 var(--mono); background: var(--ink); color: var(--paper); border-radius: 999px; padding: 3px 6px; }

/* ---- checkpoints ---- */
.cps { display: flex; align-items: center; gap: 8px; padding: 8px 16px; background: var(--chrome); border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.cps::-webkit-scrollbar { display: none; }
.cps-lead { font-size: 11.5px; color: var(--ink-3); white-space: nowrap; margin-right: 4px; }
.cps-lead b { color: var(--ink); font-family: var(--mono); }
.cp { flex: none; display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 11px 0 5px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper); cursor: pointer; font-size: 12px; transition: border-color .2s, background .2s; }
.cp:hover { border-color: var(--ink-3); }
.cp-ic { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; border: 1.5px dashed var(--ink-3); flex: none; }
.cp.part .cp-ic { border: 1.5px solid var(--ai); background: linear-gradient(90deg, var(--ai) 50%, transparent 50%); }
.cp.met { border-color: color-mix(in srgb, var(--ok) 45%, transparent); background: var(--ok-fill); }
.cp.met .cp-ic { border: 0; background: var(--ok); color: var(--on-tag); animation: pop .35s ease-out; }
.cp-l { color: var(--ink-2); }
.cp-v { font-weight: 650; font-variant-numeric: tabular-nums; }
.cp-sug { font-size: 10.5px; color: var(--ai); background: var(--ai-fill); padding: 2px 6px; border-radius: 999px; }
@keyframes pop { 0% { transform: scale(.4); } 70% { transform: scale(1.15); } 100% { transform: scale(1); } }

/* ---- work area ---- */
.work { display: flex; min-height: 0; }
.stage { flex: 1; min-width: 0; display: flex; position: relative; }
.scroller { flex: 1; min-width: 0; overflow-y: auto; overflow-x: hidden; padding: 28px 16px 140px; scroll-behavior: auto; }
.pages { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
.pagepill { position: absolute; top: 10px; right: 30px; z-index: 5; font: 500 11.5px var(--mono); background: var(--chrome); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; pointer-events: none; color: var(--ink-2); font-variant-numeric: tabular-nums; }

/* ---- the paper ---- */
.page { position: relative; background: var(--paper); box-shadow: var(--page-shadow); border-radius: 2px; aspect-ratio: 8.5 / 11; padding: 60px 66px 70px; font-family: var(--mono); font-size: 13px; line-height: 2.5; color: var(--ink); }
.page-body { transition: opacity .25s; }
.page.dim .page-body { opacity: 0.42; }
.page.dim:hover .page-body { opacity: 0.8; }
.dos-banner { position: absolute; top: 16px; left: 66px; right: 66px; display: flex; align-items: center; gap: 6px; font: 600 11px/1.4 var(--ui); color: var(--rej); background: var(--rej-fill); border: 1px solid color-mix(in srgb, var(--rej) 35%, transparent); padding: 5px 9px; border-radius: 5px; }
.page-foot { position: absolute; left: 66px; right: 66px; bottom: 22px; display: flex; justify-content: space-between; gap: 12px; font-size: 10px; line-height: 1.4; color: var(--ink-3); border-top: 1px dashed var(--line); padding-top: 7px; }
.blk { position: relative; }
.k-org { font-weight: 600; letter-spacing: 0.08em; }
.k-sub { font-size: 11px; color: var(--ink-2); line-height: 1.6; }
.k-title { font-weight: 600; margin: 16px 0 6px; border-bottom: 1.5px solid var(--ink); padding-bottom: 2px; letter-spacing: 0.03em; }
.k-meta { white-space: pre-wrap; font-size: 12px; }
.k-h { font-weight: 600; margin-top: 16px; text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px; }
.k-li { padding-left: 20px; text-indent: -14px; }
.k-li::before { content: '–  '; color: var(--ink-3); }

/* ---- evidence boxes ---- */
.ev { position: relative; color: inherit; background: var(--cf); border-radius: 3px; padding: 2px 2px; outline: 1.5px dashed var(--c); outline-offset: 0; cursor: pointer; -webkit-box-decoration-break: clone; box-decoration-break: clone; transition: background .2s, outline-color .2s; }
.ev.st-confirmed, .ev.st-added { outline-style: solid; }
.ev.st-rejected { outline: 1px dotted var(--c); background: transparent; text-decoration: line-through; text-decoration-color: var(--rej); color: var(--ink-3); }
.ev::before { content: attr(data-tag); position: absolute; left: -1.5px; bottom: 100%; margin-bottom: 1px; font: 600 8.5px/1 var(--mono); letter-spacing: 0.04em; padding: 2px 4px 2px; border-radius: 3px 3px 0 0; background: var(--c); color: var(--on-tag); white-space: nowrap; pointer-events: none; text-indent: 0; text-decoration: none; }
.ev.st-rejected::before { opacity: .7; }
.ev:hover, .ev.hot { background: color-mix(in srgb, var(--c) 22%, transparent); }
.ev.active { outline-width: 2.5px; }
.ev.hot, .ev.flash { animation: ring 1s ease-out 2; }
@keyframes ring { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--c) 55%, transparent); } 100% { box-shadow: 0 0 0 10px transparent; } }
.clean .ev { outline: none; background: none; text-decoration: none; color: inherit; }
.clean .ev::before { display: none; }
.spot .blk { color: var(--ink-faint); }
.spot .blk .ev { color: var(--ink); }
.spot .blk .ev.st-rejected { color: var(--ink-faint); }
::selection { background: color-mix(in srgb, var(--add) 35%, transparent); }

/* ---- minimap ---- */
.mm { width: 20px; flex: none; position: relative; background: var(--chrome); border-left: 1px solid var(--line); cursor: pointer; }
.mm-page { position: absolute; left: 0; right: 0; border-top: 1px solid var(--line); }
.mm-page.off { background: var(--rej-fill); }
.mm-vp { position: absolute; left: 2px; right: 2px; background: color-mix(in srgb, var(--ink) 8%, transparent); border: 1px solid color-mix(in srgb, var(--ink) 22%, transparent); border-radius: 4px; pointer-events: none; transition: top .06s linear; }
.mm-tick { position: absolute; left: 4px; right: 4px; height: 4px; border: 0; padding: 0; border-radius: 2px; background: var(--c); cursor: pointer; }
.mm-tick::after { content: ''; position: absolute; inset: -4px -4px; }
.mm-tick.st-rejected { opacity: .45; }
.mm-tick.active { left: 1px; right: 1px; box-shadow: 0 0 0 2px var(--chrome), 0 0 0 3.5px var(--c); }

/* ---- notepad + rail ---- */
.np { position: fixed; z-index: 40; display: flex; flex-direction: column; background: var(--chrome); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; transition: opacity .25s ease; }
.np.ghost { opacity: 0.3; }
.np-head { display: flex; align-items: center; gap: 7px; padding: 7px 8px 7px 10px; border-bottom: 1px solid var(--line); cursor: grab; user-select: none; touch-action: none; background: var(--chrome); }
.np-head:active { cursor: grabbing; }
.rail-head { cursor: default; }
.grip { color: var(--ink-3); display: grid; }
.np-title { font-weight: 700; font-size: 13px; }
.np-rz { position: absolute; z-index: 2; touch-action: none; }
.rz-n, .rz-s { left: 12px; right: 12px; height: 8px; cursor: ns-resize; }
.rz-n { top: -3px; } .rz-s { bottom: -3px; }
.rz-e, .rz-w { top: 12px; bottom: 12px; width: 8px; cursor: ew-resize; }
.rz-e { right: -3px; } .rz-w { left: -3px; }
.rz-ne, .rz-nw, .rz-se, .rz-sw { width: 16px; height: 16px; }
.rz-ne { top: -3px; right: -3px; cursor: nesw-resize; } .rz-sw { bottom: -3px; left: -3px; cursor: nesw-resize; }
.rz-nw { top: -3px; left: -3px; cursor: nwse-resize; }
.rz-se { bottom: 0; right: 0; width: 18px; height: 18px; cursor: nwse-resize; background: linear-gradient(135deg, transparent 50%, var(--ink-3) 50%, var(--ink-3) 57%, transparent 57%, transparent 68%, var(--ink-3) 68%, var(--ink-3) 75%, transparent 75%); opacity: .7; }
.np:hover .rz-se { opacity: 1; }
.rz-e:hover, .rz-w:hover { background: linear-gradient(90deg, transparent 3px, var(--accent) 3px, var(--accent) 5px, transparent 5px); }
.rz-n:hover, .rz-s:hover { background: linear-gradient(180deg, transparent 3px, var(--accent) 3px, var(--accent) 5px, transparent 5px); }
.np { overflow: visible; }
.np > .np-head { border-radius: 12px 12px 0 0; }
.np > .nb { overflow: hidden; border-radius: 0 0 12px 12px; }
body.resizing { user-select: none; cursor: nwse-resize; }
body.resizing.ew { cursor: ew-resize; }
body.resizing .np { transition: none; }
.rail { position: relative; }
.rail-rz { position: absolute; left: -4px; top: 0; bottom: 0; width: 8px; cursor: ew-resize; z-index: 3; touch-action: none; }
.rail-rz:hover, body.resizing.ew .rail-rz { background: linear-gradient(90deg, transparent 3px, var(--accent) 3px, var(--accent) 5px, transparent 5px); }
.catch { animation: catch .45s ease-out; }
@keyframes catch { 0% { transform: scale(1); } 40% { transform: scale(1.025); } 100% { transform: scale(1); } }
.rail { width: 360px; flex: none; display: flex; flex-direction: column; min-height: 0; background: var(--chrome); border-left: 1px solid var(--line); }
.rail.collapsed { width: 42px; }
.rail-tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 12px 0; border: 0; background: transparent; cursor: pointer; color: var(--ink-2); }
.rail-tab:hover { background: var(--chrome-2); }
.vert { writing-mode: vertical-rl; font-weight: 650; letter-spacing: 0.06em; font-size: 12px; }

.nb { display: flex; flex-direction: column; min-height: 0; flex: 1; }
.nb-sub { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tabs { display: inline-flex; background: var(--chrome-2); border-radius: 7px; padding: 2px; }
.tabs button { border: 0; background: transparent; padding: 4px 9px; border-radius: 5px; cursor: pointer; font-size: 12px; color: var(--ink-2); display: inline-flex; gap: 5px; align-items: center; }
.tabs button.on { background: var(--paper); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .12); font-weight: 600; }
.tabs .n { font: 500 10.5px var(--mono); color: var(--ink-3); }
.tabs.big button { font-size: 13px; padding: 6px 12px; }
.follow { margin-left: auto; display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--ink-3); border: 0; background: transparent; cursor: pointer; padding: 3px 6px; border-radius: 5px; font-variant-numeric: tabular-nums; }
.follow:hover { background: var(--chrome-2); color: var(--ink); }
.follow.pinned { color: var(--accent); background: var(--accent-soft); }
.follow.static { cursor: default; background: none; }
.nb-list { flex: 1; overflow-y: auto; padding: 4px 6px 8px; min-height: 0; }
.grp-h { position: sticky; top: 0; z-index: 1; background: var(--chrome); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); padding: 8px 6px 4px; font-weight: 600; }
.grp-warn { color: var(--rej); }
.row { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 9px; align-items: start; padding: 8px 8px; border-radius: 7px; cursor: pointer; border: 1px solid transparent; transition: background .15s; }
.row:hover, .row.hot { background: var(--chrome-2); }
.row.active { background: var(--paper); border-color: color-mix(in srgb, var(--c) 45%, transparent); }
.row.flash { animation: rowin .9s ease-out; }
@keyframes rowin { 0% { background: var(--cf); transform: translateX(10px); } 30% { transform: translateX(0); } 100% { background: transparent; } }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); margin-top: 5px; flex: none; }
.dot.st-ai { background: transparent; box-shadow: inset 0 0 0 2px var(--c); }
.row-top { display: flex; gap: 7px; align-items: baseline; min-width: 0; }
.row-code { font: 600 12px var(--mono); color: var(--c); flex: none; }
.row-desc { font-size: 12.5px; font-weight: 550; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row.st-rejected .row-desc, .row.st-rejected .row-q { text-decoration: line-through; color: var(--ink-3); }
.row-q { font: 11.5px/1.45 var(--mono); color: var(--ink-2); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-meta { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
.row-act { display: flex; gap: 2px; opacity: 0; transition: opacity .15s; }
.row:hover .row-act, .row.active .row-act, .row:focus-within .row-act { opacity: 1; }
.mini { font: 600 10px/1 var(--mono); color: var(--ink-2); background: var(--chrome-2); border-radius: 4px; padding: 3px 5px; letter-spacing: .02em; }
.route { font-size: 10.5px; line-height: 1; padding: 3px 6px; border-radius: 4px; white-space: nowrap; }
.r-appeal { color: var(--accent); background: var(--accent-soft); }
.r-corrected { color: var(--add); background: var(--add-fill); }
.r-info { color: var(--ink-2); background: var(--chrome-2); }
.r-excluded, .r-warn { color: var(--rej); background: var(--rej-fill); }
.empty { padding: 22px 14px; color: var(--ink-2); font-size: 12.5px; line-height: 1.55; }
.empty b { display: block; color: var(--ink); margin-bottom: 4px; }
.nb-foot { border-top: 1px solid var(--line); padding: 9px 10px 12px; display: flex; flex-direction: column; gap: 8px; }

.score { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) minmax(0, 1.35fr); gap: 6px; }
.sc, .sc-total { border: 1px solid var(--line); border-radius: 7px; padding: 5px 8px; background: var(--paper); min-width: 0; }
.sc-k { display: block; font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); font-weight: 600; }
.sc-v { display: block; font-size: 12px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sc.hi .sc-v { color: var(--ok); }
.sc-total.ok { background: var(--ok-fill); border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
.sc-total.short { background: var(--add-fill); border-color: color-mix(in srgb, var(--add) 45%, transparent); }
.sc-total b { font-family: var(--mono); }
.sc-of { font-weight: 400; color: var(--ink-2); font-size: 11px; }
.score.compact .sc-v { font-size: 11.5px; }

.bubble { position: fixed; right: 36px; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); z-index: 40; display: inline-flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 999px; background: var(--ink); color: var(--paper); border: 0; box-shadow: var(--shadow); cursor: pointer; font-weight: 600; font-size: 13px; }
.bubble .badge { background: var(--paper); color: var(--ink); }
.bubble-sub { font-weight: 400; font-size: 11.5px; opacity: .75; }
.snap-hint { position: fixed; right: 0; top: 0; bottom: 0; width: 360px; z-index: 35; background: color-mix(in srgb, var(--accent) 12%, transparent); border-left: 2px dashed var(--accent); display: grid; place-items: center; pointer-events: none; animation: fade .15s; }
.snap-hint span { font-weight: 650; color: var(--accent); background: var(--paper); padding: 6px 12px; border-radius: 999px; box-shadow: var(--shadow); }
@keyframes fade { from { opacity: 0; } }

/* ---- buttons ---- */
.ib { width: 28px; height: 28px; display: inline-grid; place-items: center; border: 0; background: transparent; color: var(--ink-2); border-radius: 6px; cursor: pointer; flex: none; }
.ib.sm { width: 24px; height: 24px; }
.ib:hover { background: var(--chrome-2); color: var(--ink); }
.ib.ok:hover { color: var(--ok); background: var(--ok-fill); }
.ib.no:hover { color: var(--rej); background: var(--rej-fill); }
